services:
  telegram-mcp-existing:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: telegram-mcp-existing
    env_file:
      - path: ../.env.existing
        required: false
    environment:
      TELEGRAM_ACCOUNT_NAME: existing
      MCP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  telegram-mcp-main:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: telegram-mcp-main
    env_file:
      - path: ../.env.main
        required: false
    environment:
      TELEGRAM_ACCOUNT_NAME: main
      MCP_PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
